$schema: https://azuremlschemas.azureedge.net/latest/commandJob.schema.json
type: command
experiment_name: hydrology-smoke
display_name: hydrology-lightgbm-smoke
compute: azureml:cpu-cluster
environment: azureml:hydrology-training@latest
code: src
command: >-
  python train.py
environment_variables:
  MLFLOW_TRACKING_URI: https://eastasia.api.azureml.ms/mlflow/v1.0/subscriptions/838d94c7-d2fd-4c8c-8ceb-ad3ce9dfc707/resourceGroups/rg-hidrologi-v0/providers/Microsoft.MachineLearningServices/workspaces/mlw-hidrologi-v0
  MLFLOW_EXPERIMENT: hydrology-smoke
  TRAIN_START: "2015-10-08"
  TRAIN_END: "2015-10-10"
  TRAIN_VAL_START: "2015-10-11"
  TRAIN_VAL_END: "2015-10-12"
  TRAIN_TEST_START: "2015-10-13"
  TRAIN_TEST_END: "2015-10-14"
  TRAIN_MIN_ROWS: "100"
  TRAIN_INCLUDE_PARTIAL: "true"
inputs:
  gold_features:
    type: uri_folder
    mode: download
    path: azureml://datastores/workspaceblobstore/paths/gold_features/features
